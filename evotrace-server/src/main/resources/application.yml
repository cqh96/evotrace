spring:
  application:
    name: evotrace-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/evotrace
    username: evotrace
    password: evotrace
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: latest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: io.evotrace.protocol.envelope.Envelope
  ai:
    openai:
      base-url: ${AI_BASE_URL:https://api.openai.com}
      api-key: ${AI_API_KEY:sk-placeholder}
      chat:
        options:
          model: ${AI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2

evotrace:
  ingestion:
    max-inline-diff-bytes: 262144
    signature-header: X-EvoTrace-Signature
  snapshot:
    full-baseline-interval: 20
  ai:
    privacy-default: STRUCTURE_ONLY   # FULL_CODE / STRUCTURE_ONLY / LOCAL_ONLY
    summary-model: ${AI_CHAT_MODEL:gpt-4o-mini}
    release-notes-model: ${AI_CHAT_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      app: evotrace-server

server:
  port: 8080
