apiVersion: v1
kind: Service
metadata:
  name: {{ include "evotrace.serviceName" . }}
  labels:
    {{- include "evotrace.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "evotrace.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: {{ .Values.service.portName }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP