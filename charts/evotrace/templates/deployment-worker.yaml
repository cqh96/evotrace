apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evotrace.fullname" . }}-worker
  labels:
    {{- include "evotrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      {{- include "evotrace.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "evotrace.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "evotrace.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "evotrace.image" (list . "worker") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # AI 异步消费者：仅做存活探针（无对外 HTTP 端口）
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: {{ include "evotrace.fullname" . }}-config
            - secretRef:
                name: {{ include "evotrace.fullname" . }}-secret
          env:
            {{- include "evotrace.envs" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}