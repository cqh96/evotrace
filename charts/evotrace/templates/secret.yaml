apiVersion: v1
kind: Secret
metadata:
  name: {{ include "evotrace.fullname" . }}-secret
  labels:
    {{- include "evotrace.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 敏感口令统一在此渲染（base64 由 K8s 自动处理）。
  # 生产环境请通过 --set 或 values-prod.yaml 覆盖，切勿使用默认口令。
  EVOTRACE_EXTERNAL_POSTGRESQL_PASSWORD: {{ .Values.external.postgresql.password | quote }}
  EVOTRACE_EXTERNAL_REDIS_PASSWORD: {{ .Values.external.redis.password | quote }}
  EVOTRACE_EXTERNAL_CLICKHOUSE_PASSWORD: {{ .Values.external.clickhouse.password | quote }}
  EVOTRACE_EXTERNAL_MINIO_ACCESSKEY: {{ .Values.external.minio.accessKey | quote }}
  EVOTRACE_EXTERNAL_MINIO_SECRETKEY: {{ .Values.external.minio.secretKey | quote }}
  EVOTRACE_APP_AI_APIKEY: {{ .Values.app.ai.apiKey | quote }}