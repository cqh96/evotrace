apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "evotrace.fullname" . }}-server
  labels:
    {{- include "evotrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount.server }}
  selector:
    matchLabels:
      {{- include "evotrace.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "evotrace.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "evotrace.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "evotrace.image" (list . "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ .Values.service.portName }}
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          # 健康检查：Spring Boot Actuator
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # 应用配置（ConfigMap）与敏感口令（Secret）
          envFrom:
            - configMapRef:
                name: {{ include "evotrace.fullname" . }}-config
            - secretRef:
                name: {{ include "evotrace.fullname" . }}-secret
          # 外部依赖连接（通过 _helpers 中的 env 模板渲染）
          env:
            {{- include "evotrace.envs" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.server | nindent 12 }}