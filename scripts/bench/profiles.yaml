# =========================================================================
# EvoTrace 性能压测 Profile（档位定义）
# -------------------------------------------------------------------------
# 定义三档压测规模，供压测脚本引用：
#   small    小压力——快速冒烟验证链路是否通畅
#   medium   中等压力——常规回归压测
#   large    大压力——容量/极限摸底
#
# 字段说明：
#   concurrency  并发连接数（同时发送事件的线程 / k6 VU）
#   events       事件总量（共发送的事件条数）
#   duration     压测持续时间（秒）
#
# 用法：
#   python3 scripts/bench/seed.py --profile medium
#   或手动指定 --concurrency / --events / --duration
# =========================================================================

# 小压力档——并发 20、事件量 5k、时长 30s
small:
  concurrency: 20     # 并发数
  events: 5000        # 事件总量
  duration: 30        # 时长（秒）

# 中等压力档——并发 100、事件量 50k、时长 120s
medium:
  concurrency: 100    # 并发数
  events: 50000       # 事件总量
  duration: 120       # 时长（秒）

# 大压力档——并发 500、事件量 200k、时长 300s
large:
  concurrency: 500    # 并发数
  events: 200000      # 事件总量
  duration: 300       # 时长（秒）